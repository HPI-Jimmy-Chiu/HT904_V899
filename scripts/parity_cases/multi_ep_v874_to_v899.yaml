name: Multi EP V874.3 -> V899 砍半版搬移對等性
source_version: V874
target_version: V899

# ---------------------------------------------------------------------------
# 行為錨點：API 呼叫的 (引數) 簽名是否兩版等價
# ---------------------------------------------------------------------------
# pick: 用逗號分隔的引數索引（0-based），只比對這些位置
# guard: 引數中必須出現的關鍵字（粗略過濾，避免抓到別的 ADAM 板）
behavior_anchors:
  - api: ADAMTCP_WriteReg
    guard: Address[2]
    pick: 1,2,3
    # pick 1=站號(=1), 2=起始 reg, 3=count
    # V874 ==3: (Address[2], 1, 1, 16, ...)
    # V899 ==3: (Address[2], 1, 1, 8, ...) 和 (Address[2], 1, 33, 8, ...)
    # 預期：V899 應出現「1, 1, 16」這個簽名（與 V874 對齊）；
    #       現況不會出現 -> RED

# ---------------------------------------------------------------------------
# 資料錨點：全域變數宣告是否一致
# ---------------------------------------------------------------------------
data_anchors:
  - var: iAPAXDualEPValue
  - var: iAPAXEPValue
  - var: INSTALL_DOUBLE_EP

# ---------------------------------------------------------------------------
# 常數錨點：字串字面值（IP / INI key 等）
# ---------------------------------------------------------------------------
constant_anchors:
  - literal: "172.16.8.112"
  - literal: "172.16.8.110"
  - literal: "INSTALL_DOUBLE_EP"
